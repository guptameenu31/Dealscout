# Run the API and the built web app in containers:  docker compose up --build
# Then open http://localhost:5173
services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./data:/app/data # price history + result cache survive restarts
      # Vertex AI login from `gcloud auth application-default login` (Cloud Run provides its own; Windows path)
      - ${APPDATA}/gcloud:/gcloud:ro

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:8080
      PORT: "5173" # the built app is served by `vite preview` on $PORT
    depends_on:
      - api

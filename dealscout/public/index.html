<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3fa; --bg2: #eaf3f1; --surface: rgba(255,255,255,.78); --solid: #ffffff; --ink: #34324a; --muted: #7b7893; --line: #e6e3f0;
    --accent: #7b6fe0; --accent-soft: #ebe8fb; --on-accent: #ffffff;
    --green: #2f8a68; --green-bg: #dff3ea; --amber: #a9691c; --amber-bg: #fcebd2;
    --rose: #b4485c; --rose-bg: #fce3e7; --grey-bg: #efedf6;
    --line-ok: #4aa583; --shadow: 0 10px 30px rgba(86,76,160,.08);
    --serif: Fraunces, Georgia, "Times New Roman", serif; --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b2b; --bg2: #1a2425; --surface: rgba(43,40,63,.72); --solid: #2b283f; --ink: #e4e2f2; --muted: #9d9ab8; --line: #3a3753;
      --accent: #a79df5; --accent-soft: #38345a; --on-accent: #1d1b2b;
      --green: #8fd6b6; --green-bg: #25403a; --amber: #efc487; --amber-bg: #433420;
      --rose: #f0a3b0; --rose-bg: #46283a; --grey-bg: #34314c; --line-ok: #7fcaa8; --shadow: 0 10px 30px rgba(0,0,0,.25); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 15px/1.55 var(--sans); min-height: 100vh;
    background: radial-gradient(900px 500px at 10% -10%, var(--accent-soft), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, var(--bg2), transparent 55%), var(--bg); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 16px 72px; }
  header { text-align: center; padding: 12px 0 8px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; }
  .mark { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; }
  h1 { font: 600 34px/1.1 var(--serif); margin: 0; letter-spacing: -.01em; }
  .tag { color: var(--muted); margin-top: 8px; font-size: 16px; }
  .panel { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin-top: 26px; box-shadow: var(--shadow); }
  label { font-weight: 500; display: block; margin-bottom: 8px; color: var(--muted); }
  textarea { width: 100%; min-height: 82px; resize: vertical; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--solid); color: var(--ink); font: inherit; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .ex { background: var(--accent-soft); border: 0; color: var(--accent); border-radius: 999px; padding: 6px 14px; font: 500 13px var(--sans); cursor: pointer; }
  .ex:hover { filter: brightness(.97); }
  button.go { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 14px; padding: 12px 24px; font: 700 15px var(--sans); cursor: pointer;
    box-shadow: 0 6px 16px rgba(123,111,224,.28); }
  button.go:disabled { opacity: .6; cursor: wait; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--grey-bg); border-radius: 12px; padding: 3px; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 7px 14px; border-radius: 9px; font: 500 13px var(--sans); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--solid); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .spec { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--grey-bg); border-radius: 999px; padding: 4px 13px; font-size: 13px; color: var(--ink); }
  .chip b { font-weight: 700; }
  .sum { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  .stat { flex: 1 1 180px; border-radius: 20px; padding: 16px 18px; display: flex; align-items: baseline; gap: 10px; }
  .stat .n { font: 600 34px/1 var(--serif); }
  .stat.g { background: var(--green-bg); color: var(--green); } .stat.a { background: var(--amber-bg); color: var(--amber); }
  .stat.r { background: var(--rose-bg); color: var(--rose); }
  .cards { display: grid; gap: 14px; margin-top: 18px; }
  .card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 22px; padding: 20px 22px;
    display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px 26px; box-shadow: var(--shadow); }
  @media (max-width: 660px) { .card { grid-template-columns: minmax(0, 1fr); } }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; border-radius: 999px; padding: 4px 11px; }
  .b-buy_now { background: var(--green-bg); color: var(--green); } .b-wait { background: var(--amber-bg); color: var(--amber); }
  .b-skip { background: var(--grey-bg); color: var(--muted); }
  .fake { background: var(--rose-bg); color: var(--rose); }
  .name { font: 600 19px/1.3 var(--serif); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  .name:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .price { font: 600 26px/1.2 var(--serif); margin-top: 8px; }
  .price s { color: var(--muted); font: 400 14px var(--sans); margin-left: 8px; }
  ul.why { margin: 10px 0 0; padding-left: 18px; color: var(--ink); font-size: 14px; }
  ul.why li::marker { color: var(--accent); }
  .chart { align-self: center; background: var(--solid); border-radius: 16px; padding: 12px 12px 8px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .cap { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fit { margin-top: 12px; border-radius: 14px; padding: 10px 14px; font-size: 14px; background: var(--green-bg); color: var(--ink); }
  .fit.more { background: var(--amber-bg); } .fit.partial { background: var(--grey-bg); }
  .fit .fh { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--green); margin-bottom: 2px; }
  .fit.more .fh { color: var(--amber); } .fit.partial .fh { color: var(--muted); }
  .conf { font-size: 12px; color: var(--muted); }
  .empty, .err { text-align: center; color: var(--muted); padding: 36px 8px; }
  .err { color: var(--rose); }
  .note { font-size: 12px; color: var(--muted); margin-top: 20px; text-align: center; }
  .trace { padding: 18px 22px; }
  .trace h2 { font: 600 16px var(--serif); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .trace ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .trace li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; animation: in .25s ease both; }
  .trace .ic { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; margin-top: 2px; background: var(--grey-bg); color: var(--muted); }
  .trace .good .ic { background: var(--green-bg); color: var(--green); } .trace .warn .ic { background: var(--rose-bg); color: var(--rose); }
  .trace .skip { color: var(--muted); } .trace .live .ic { background: var(--accent-soft); color: var(--accent); }
  .trace .live .ic::after { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
  .trace details summary { cursor: pointer; font: 600 15px var(--serif); }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .trace li, .trace .live .ic::after { animation: none; } }
  .skeleton { height: 130px; border-radius: 22px; background: var(--grey-bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 11l2 2 3.5-4" stroke-linejoin="round"/></svg></span><h1>DealScout</h1></div>
    <div class="tag">Watches the need, not the product.</div>
  </header>

  <section class="panel">
    <label for="q">What do you want, and what can you spend?</label>
    <textarea id="q">I need a 2-input USB audio interface with phantom power for home recording, under ₹15k</textarea>
    <div class="examples" id="examples"></div>
    <div class="row">
      <div class="seg" role="group" aria-label="Data source">
        <button id="m-test" aria-pressed="true">Test data</button>
        <button id="m-live" aria-pressed="false" disabled title="Needs GEMINI_API_KEY on the server">Live (Gemini)</button>
      </div>
      <span class="spacer"></span>
      <button class="go" id="go">Scout deals</button>
    </div>
  </section>

  <div id="out"><div class="empty">Describe a need above and DealScout will find matches and judge each price.</div></div>
  <p class="note" id="note"></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const inr = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const LABEL = { buy_now: "BUY NOW", wait: "WAIT", skip: "OVER BUDGET" };
let live = false;

const EXAMPLES = [
  "2-input USB audio interface with phantom power, under ₹15k",
  "audio interface for podcasting under ₹10,000",
];
$("examples").innerHTML = EXAMPLES.map((e) => `<button class="ex" type="button">${esc(e)}</button>`).join("");
$("examples").addEventListener("click", (e) => { if (e.target.classList.contains("ex")) $("q").value = e.target.textContent; });

function setMode(l) {
  live = l;
  $("m-test").setAttribute("aria-pressed", String(!l));
  $("m-live").setAttribute("aria-pressed", String(l));
}
$("m-test").onclick = () => setMode(false);
$("m-live").onclick = () => setMode(true);
fetch("/api/config").then((r) => r.json()).then((c) => { if (c.liveAvailable) $("m-live").disabled = false; }).catch(() => {});

function chart(history, current, claimed) {
  const W = 240, H = 84, padX = 4, padY = 8;
  const all = [...history, current, ...(claimed ? [claimed] : [])];
  const lo = Math.min(...all) * 0.96, hi = Math.max(...all) * 1.04;
  const n = history.length;
  const x = (i) => padX + (i / Math.max(n, 1)) * (W - 2 * padX);
  const y = (v) => padY + (1 - (v - lo) / (hi - lo)) * (H - 2 * padY);
  const pts = history.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const cur = `<circle cx="${x(n).toFixed(1)}" cy="${y(current).toFixed(1)}" r="4.5" fill="var(--line-ok)"/>`;
  const claim = claimed
    ? `<line x1="${padX}" x2="${W - padX}" y1="${y(claimed)}" y2="${y(claimed)}" stroke="var(--rose)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>`
    : "";
  const line = n ? `<polyline points="${pts} ${x(n).toFixed(1)},${y(current).toFixed(1)}" fill="none" stroke="var(--line-ok)" stroke-width="2.2" stroke-linejoin="round"/>` : "";
  const cap = n ? `${n}-day price${claimed ? ` · <span style="color:var(--rose)">- - store's "original"</span>` : ""}` : "No price history yet";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history">${claim}${line}${cur}</svg><div class="cap">${cap}</div></div>`;
}

function card({ product: p, verdict: v, fit, history }) {
  return `<article class="card">
    <div>
      <div class="top"><span class="badge b-${v.label}">${LABEL[v.label]}</span>${v.fakeDiscount ? '<span class="badge fake">FAKE DISCOUNT</span>' : ""}
        <span class="conf">${v.confidence} confidence</span></div>
      <div style="margin-top:8px"><a class="name" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
      <div class="meta">${esc(p.store)}</div>
      <div class="price">${inr(p.currentPrice)}${p.claimedOriginal ? `<s>${inr(p.claimedOriginal)}</s>` : ""}</div>
      <ul class="why">${v.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
      ${fit && fit.notes.length ? `<div class="fit ${fit.level}"><div class="fh">${esc(fit.summary)}</div>${fit.notes.map(esc).join(" ")}</div>` : ""}
    </div>
    ${chart(history, p.currentPrice, p.claimedOriginal)}
  </article>`;
}

function render(d, target) {
  const c = (l) => d.items.filter((i) => i.verdict.label === l).length;
  const fakes = d.items.filter((i) => i.verdict.fakeDiscount).length;
  const must = d.spec.mustHaves.map((m) => `<span class="chip">${esc(m)}</span>`).join("");
  target.innerHTML = `
    <section class="panel"><div class="spec">
      <span class="chip"><b>${esc(d.spec.category)}</b></span><span class="chip">Budget <b>${inr(d.spec.budget)}</b></span>${must}
      <span class="chip" style="margin-left:auto">spec via ${d.via}</span></div></section>
    <div class="sum">
      <div class="stat g"><div class="n">${c("buy_now")}</div>Buy now</div>
      <div class="stat a"><div class="n">${c("wait")}</div>Wait</div>
      <div class="stat r"><div class="n">${fakes}</div>Fake discounts caught</div>
    </div>
    <div class="cards">${d.items.map(card).join("") || '<div class="empty">No matches found.</div>'}</div>`;
  $("note").textContent = d.source === "mock" ? "Showing test data: products and 60-day price history are simulated." : `Source: ${d.source}. Price history builds up daily from today.`;
}

const ICON = { info: "•", good: "✓", warn: "!", skip: "–" };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true; btn.textContent = "Scouting…";
  $("note").textContent = "";
  $("out").innerHTML = '<section class="panel trace"><h2>DealScout is working</h2><ol id="steps"></ol></section><div id="results"></div>';
  const steps = $("steps");
  let result = null, error = null, current = null;
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Show events at a readable pace even when the server answers instantly.
  const queue = [];
  let reading = true;
  const settle = () => { if (current) { current.classList.remove("live"); const ic = current.querySelector(".ic"); ic.textContent = ICON[current.dataset.kind]; } };
  const pump = (async () => {
    while (reading || queue.length) {
      const e = queue.shift();
      if (!e) { await sleep(40); continue; }
      settle();
      const li = document.createElement("li");
      li.className = e.kind + " live"; li.dataset.kind = e.kind;
      li.innerHTML = `<span class="ic"></span><span>${esc(e.text)}</span>`;
      steps.appendChild(li); current = li;
      await sleep(fast ? 0 : e.kind === "warn" ? 900 : 480);
    }
    settle();
  })();

  try {
    const r = await fetch("/api/scout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query: $("q").value, live }) });
    if (!r.ok) throw new Error((await r.json()).error || "Something went wrong");
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const m = JSON.parse(line);
        if (m.event === "trace") queue.push(m);
        else if (m.event === "result") result = m;
        else if (m.event === "error") error = m.error;
      }
    }
  } catch (e) { error = e.message; }
  reading = false;
  await pump;

  if (error || !result) {
    $("out").innerHTML = `<div class="err">${esc(error || "No result")}</div>`;
  } else {
    const trace = $("out").querySelector(".trace");
    trace.querySelector("h2").outerHTML = "";
    const ol = trace.querySelector("ol");
    const det = document.createElement("details");
    det.innerHTML = `<summary>How DealScout decided (${ol.children.length} steps)</summary>`;
    det.appendChild(ol);
    trace.appendChild(det);
    render(result, $("results"));
  }
  btn.disabled = false; btn.textContent = "Scout deals";
};
</script>
</body>
</html>
